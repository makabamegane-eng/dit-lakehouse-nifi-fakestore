# =============================================================================
#  Journalisation Spark — niveau WARN par défaut pour garder des logs Airflow
#  lisibles, INFO conservé pour nos propres jobs (logger « lakehouse ») et pour
#  Iceberg/Nessie afin de tracer les commits du catalogue.
# =============================================================================
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %p %c{1}: %m%n

logger.lakehouse.name = lakehouse
logger.lakehouse.level = info

logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = info

logger.nessie.name = org.projectnessie
logger.nessie.level = info

logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error

logger.s3a.name = org.apache.hadoop.fs.s3a
logger.s3a.level = error
