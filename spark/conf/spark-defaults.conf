# =============================================================================
#  Configuration Spark commune au master, aux workers et au driver Airflow.
# -----------------------------------------------------------------------------
#  Tout ce qui est ici n'a pas à être répété dans chaque job ni dans chaque
#  spark-submit : un seul endroit décrit « comment ce cluster parle à Nessie
#  et à MinIO ». Les jobs Python n'ont donc plus qu'à faire du SQL.
#
#  Note : spark-defaults.conf ne supporte pas la substitution de variables
#  d'environnement. Les noms de services (minio, nessie) sont figés par le
#  docker-compose, et les SECRETS ne sont volontairement PAS écrits ici :
#  ils sont fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY injectées
#  dans les conteneurs (voir bloc x-spark-env du docker-compose).
# =============================================================================

# ------------------------------------------------- Extensions SQL -----------
spark.sql.extensions                     org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

# ------------------------------------- Catalogue Iceberg adossé à Nessie ----
spark.sql.catalog.nessie                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.catalog-impl    org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie.uri             http://nessie:19120/api/v2
spark.sql.catalog.nessie.ref             main
spark.sql.catalog.nessie.authentication.type NONE
spark.sql.catalog.nessie.warehouse       s3a://lakehouse-warehouse/warehouse
spark.sql.catalog.nessie.io-impl         org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.nessie.s3.endpoint     http://minio:9000
spark.sql.catalog.nessie.s3.path-style-access true
spark.sql.catalog.nessie.client.region   us-east-1
spark.sql.defaultCatalog                 nessie

# ------------------------------- Connecteur s3a:// pour la zone brute JSON --
# La lecture des JSON déposés par NiFi passe par Hadoop-AWS (s3a), tandis que
# l'écriture des tables Iceberg passe par S3FileIO (AWS SDK v2) : les deux
# chemins doivent être configurés.
spark.hadoop.fs.s3a.endpoint             http://minio:9000
spark.hadoop.fs.s3a.path.style.access    true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl                 org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.connection.maximum   64
spark.hadoop.fs.s3a.fast.upload          true
spark.hadoop.fs.s3a.committer.name       directory

# --------------------------------------------------------- Exécution -------
spark.master                             spark://spark-master:7077
spark.sql.adaptive.enabled               true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.shuffle.partitions             8
spark.sql.sources.partitionOverwriteMode dynamic
spark.serializer                         org.apache.spark.serializer.KryoSerializer
spark.sql.session.timeZone               UTC

# ------------------------------------------------- Écritures Iceberg -------
# Compaction implicite raisonnable pour un volume de démonstration : on évite
# la multiplication de petits fichiers Parquet à chaque snapshot quotidien.
spark.sql.iceberg.handle-timestamp-without-timezone true
spark.sql.iceberg.check-nullability      false

# --------------------------------------------------------- Supervision -----
spark.metrics.conf                       /opt/spark/conf/metrics.properties
spark.ui.prometheus.enabled              true
spark.eventLog.enabled                   false
