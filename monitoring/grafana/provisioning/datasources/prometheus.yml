# Source de données provisionnée automatiquement : aucune configuration
# manuelle n'est nécessaire après `docker compose up`.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
