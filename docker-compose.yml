# =============================================================================
#  DIT — MASTER 2 INGÉNIERIE DES DONNÉES / BIG DATA
#  Examen : Plateforme Data Lakehouse & Ingestion NiFi — M. PENE
# -----------------------------------------------------------------------------
#  Topologie retenue (voir docs/architecture.md) :
#
#    FakeStoreAPI ──HTTP──> [NiFi] ──S3──> [MinIO / lakehouse-raw]
#                                                  │
#                              [Airflow] ─spark-submit─> [Spark master+workers]
#                                                  │
#                                        Bronze → Silver → Gold (Iceberg)
#                                                  │
#                        [Nessie] catalogue versionné  ──> [MinIO / warehouse]
#                                                  │
#                                              [Dremio] SQL
#
#  Choix de conception structurants :
#   * un seul réseau bridge `lakehouse` : la résolution DNS par nom de service
#     (minio, nessie, spark-master...) est la clé de toute l'intégration ;
#   * un PostgreSQL unique hébergeant 3 bases logiques (airflow, nessie, dremio)
#     plutôt que 3 conteneurs : économie de RAM sur un poste de dev, isolation
#     logique suffisante pour l'usage attendu ;
#   * healthchecks + depends_on/condition pour maîtriser l'ordre de démarrage
#     (MinIO et Postgres avant Nessie, Nessie avant Spark/Dremio) ;
#   * volumes nommés pour tout état devant survivre à un `docker compose down`.
# =============================================================================

x-common-env: &common-env
  TZ: UTC

x-spark-env: &spark-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_REGION: ${MINIO_REGION}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  RAW_BUCKET: ${RAW_BUCKET}
  WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET}
  NESSIE_URI: ${NESSIE_URI}
  NESSIE_REF: ${NESSIE_REF}
  NESSIE_CATALOG_NAME: ${NESSIE_CATALOG_NAME}
  SYNTHETIC_HISTORY_ENABLED: ${SYNTHETIC_HISTORY_ENABLED}
  SYNTHETIC_HISTORY_SEED: ${SYNTHETIC_HISTORY_SEED}
  HISTORY_MONTHS: ${HISTORY_MONTHS}

networks:
  lakehouse:
    name: lakehouse
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  nessie-data:
  dremio-data:
  nifi-database:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
  nifi-state:
  nifi-logs:
  nifi-conf:
  prometheus-data:
  grafana-data:

services:

  # ===========================================================================
  #  1. STOCKAGE OBJET — MinIO
  #     Deux buckets : zone brute (NiFi) et warehouse Iceberg (Spark/Nessie).
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION}
      # Expose /minio/v2/metrics/cluster sans authentification pour Prometheus
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [lakehouse]

  # Conteneur éphémère : crée les buckets et la structure de la zone brute.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RAW_BUCKET: ${RAW_BUCKET}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET}
    entrypoint: ["/bin/sh", "/opt/scripts/init-minio.sh"]
    volumes:
      - ./scripts/init-minio.sh:/opt/scripts/init-minio.sh:ro
    networks: [lakehouse]
    restart: "no"

  # ===========================================================================
  #  2. MÉTADONNÉES — PostgreSQL (bases airflow / nessie / dremio)
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    hostname: postgres
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [lakehouse]

  # ===========================================================================
  #  3. CATALOGUE — Project Nessie (versionné, backend JDBC PostgreSQL)
  # ===========================================================================
  nessie:
    image: ghcr.io/projectnessie/nessie:0.77.1
    container_name: nessie
    hostname: nessie
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      # Persistance des commits du catalogue dans PostgreSQL (pas en mémoire :
      # le catalogue doit survivre à un redémarrage, c'est la source de vérité
      # des tables Iceberg).
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${NESSIE_DB}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_HTTP_PORT: "19120"
      # Métriques Micrometer exposées sur /q/metrics pour Prometheus
      QUARKUS_MICROMETER_EXPORT_PROMETHEUS_ENABLED: "true"
    ports:
      - "19120:19120"
    volumes:
      - nessie-data:/tmp
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/19120 && echo -e 'GET /q/health/live HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks: [lakehouse]

  # ===========================================================================
  #  4. TRAITEMENT — Cluster Spark (1 master + 2 workers)
  #     Image custom : Spark 3.5.1 + Iceberg 1.5.2 + extensions Nessie + S3A
  # ===========================================================================
  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    image: dit-lakehouse/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    environment:
      <<: [*common-env, *spark-env]
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "7077:7077"   # RPC master
      - "8090:8080"   # UI master (8080 hôte réservé à NiFi)
      - "4040:4040"   # UI application (driver en client mode)
    volumes:
      - ./spark/jobs:/opt/spark-jobs:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [lakehouse]

  spark-worker-1:
    image: dit-lakehouse/spark:3.5.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081
      --cores ${SPARK_WORKER_CORES} --memory ${SPARK_WORKER_MEMORY}
    environment:
      <<: [*common-env, *spark-env]
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8091:8081"
    volumes:
      - ./spark/jobs:/opt/spark-jobs:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro
    depends_on:
      spark-master:
        condition: service_started
    networks: [lakehouse]

  spark-worker-2:
    image: dit-lakehouse/spark:3.5.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081
      --cores ${SPARK_WORKER_CORES} --memory ${SPARK_WORKER_MEMORY}
    environment:
      <<: [*common-env, *spark-env]
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8092:8081"
    volumes:
      - ./spark/jobs:/opt/spark-jobs:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro
    depends_on:
      spark-master:
        condition: service_started
    networks: [lakehouse]

  # ===========================================================================
  #  5. INGESTION — Apache NiFi (unique point d'entrée des données)
  # ===========================================================================
  nifi:
    image: apache/nifi:1.28.1
    container_name: nifi
    hostname: nifi
    environment:
      <<: *common-env
      # Accès HTTP simplifié : positionner NIFI_WEB_HTTP_PORT désactive le mode
      # HTTPS/single-user activé par défaut depuis NiFi 1.14. Justification et
      # procédure alternative (docker logs) : docs/architecture.md §2.4.
      NIFI_WEB_HTTP_PORT: ${NIFI_WEB_HTTP_PORT}
      NIFI_WEB_HTTP_HOST: "0.0.0.0"
      NIFI_WEB_PROXY_HOST: "localhost:8080,nifi:8080"
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY}
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
      # Variables consommées par le script de construction du flow
      FAKESTORE_API_BASE_URL: ${FAKESTORE_API_BASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      RAW_BUCKET: ${RAW_BUCKET}
    ports:
      - "8080:8080"                                   # UI NiFi
      - "${NIFI_LISTEN_HTTP_PORT}:${NIFI_LISTEN_HTTP_PORT}"  # ListenHTTP (déclenchement)
      - "9092:9092"                                   # PrometheusReportingTask
    volumes:
      # Persistance complète de l'état interne de NiFi (exigence Partie 2.3)
      - nifi-database:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-logs:/opt/nifi/nifi-current/logs
      - nifi-conf:/opt/nifi/nifi-current/conf
      - ./nifi/flow:/opt/nifi/flow-exports
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/nifi-api/system-diagnostics >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s
    depends_on:
      minio:
        condition: service_healthy
    networks: [lakehouse]

  # ===========================================================================
  #  6. MOTEUR DE REQUÊTE — Dremio OSS (imposé)
  # ===========================================================================
  dremio:
    image: dremio/dremio-oss:25.0
    container_name: dremio
    hostname: dremio
    environment:
      <<: *common-env
      DREMIO_JAVA_SERVER_EXTRA_OPTS: >-
        -Dpaths.dist=file:///opt/dremio/data/dist
        -Ddremio.iceberg.enabled=true
        -Ddebug.addDefaultUser=true
    ports:
      - "9047:9047"    # UI / REST
      - "31010:31010"  # ODBC / JDBC (Dremio legacy)
      - "32010:32010"  # Arrow Flight SQL
    volumes:
      - dremio-data:/opt/dremio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9047/apiv2/server_status | grep -q ok || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      nessie:
        condition: service_started
      minio:
        condition: service_healthy
    networks: [lakehouse]

  # ===========================================================================
  #  7. ORCHESTRATION — Apache Airflow (webserver + scheduler + init)
  #     Image custom : Airflow 2.9.3 + JRE 17 + binaires Spark 3.5.1
  #     (spark-submit en mode client vers spark://spark-master:7077)
  # ===========================================================================
  airflow-init:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile
    image: dit-lakehouse/airflow:2.9.3
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      <<: [*common-env, *spark-env]
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "15"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__METRICS__STATSD_ON: "false"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # Contexte plateforme consommé par les DAGs
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY}
      NIFI_BASE_URL: http://nifi:8080
      NIFI_INGEST_URL: http://nifi:${NIFI_LISTEN_HTTP_PORT}/ingest
      DREMIO_URL: http://dremio:9047
      FAKESTORE_API_BASE_URL: ${FAKESTORE_API_BASE_URL}
      HISTORY_END_DATE: ${HISTORY_END_DATE}
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
      - ./spark/jobs:/opt/spark-jobs:ro
    entrypoint: ["/bin/bash", "-c", "/opt/airflow/scripts/init-airflow.sh"]
    user: "0:0"
    networks: [lakehouse]
    restart: "no"

  airflow-webserver:
    image: dit-lakehouse/airflow:2.9.3
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks: [lakehouse]

  airflow-scheduler:
    image: dit-lakehouse/airflow:2.9.3
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 45s
    networks: [lakehouse]

  # ===========================================================================
  #  8. SUPERVISION — Prometheus + Grafana (+ exporters infra)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [lakehouse]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    hostname: grafana
    environment:
      <<: *common-env
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    ports:
      # 3000 est un port très disputé (Grafana, Node, Next.js, Semaphore…) :
      # on publie sur 3001 pour ne pas entrer en conflit avec un service existant.
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [lakehouse]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    hostname: node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [lakehouse]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    hostname: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8093:8080"
    networks: [lakehouse]
